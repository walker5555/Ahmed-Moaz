<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.date %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }} · Security Field Notes</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <style>
    :root {
      color-scheme: light;
      --paper: #f8f7f3;
      --ink: #18272a;
      --muted: #4d5d5e;
      --rule: #d8ddda;
      --accent: #235c50;
      --serif: Georgia, 'Times New Roman', serif;
      --sans: system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 1rem/1.65 var(--sans); }
    a { color: var(--accent); text-underline-offset: .22em; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }
    .frame { width: min(100% - 3rem, 66rem); margin-inline: auto; }
    .masthead { border-block-end: 1px solid var(--rule); }
    .masthead .frame { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .75rem 2rem; padding-block: 1.15rem; }
    .brand { color: var(--ink); font-weight: 750; letter-spacing: -.025em; text-decoration: none; }
    .navigation { display: flex; flex-wrap: wrap; gap: .5rem 1.5rem; }
    .navigation a { font-size: .875rem; text-decoration: none; }
    .navigation a:hover { text-decoration: underline; }
    main { padding-block: clamp(3rem, 9vw, 7rem) 4rem; }
    h1, h2, h3 { margin: 0; line-height: 1.12; }
    h1 { max-width: 16ch; font: 500 clamp(3rem, 9vw, 7rem)/.98 var(--serif); letter-spacing: -.065em; }
    .summary { max-width: 52ch; margin: 1.4rem 0 0; color: var(--muted); font-size: clamp(1rem, 2vw, 1.2rem); }
    .archive { margin-top: clamp(3.25rem, 7vw, 6rem); }
    .archive h2 { padding-bottom: .85rem; border-bottom: 2px solid var(--ink); font-size: 1rem; }
    .post { display: grid; grid-template-columns: 7rem minmax(0, 1fr); gap: .45rem 1.75rem; padding-block: 1.5rem; border-bottom: 1px solid var(--rule); }
    .post h3 { grid-column: 2; font: 500 clamp(1.4rem, 3vw, 1.9rem)/1.2 var(--serif); letter-spacing: -.025em; }
    .post h3 a { color: var(--ink); text-decoration: none; }
    .post h3 a:hover { color: var(--accent); text-decoration: underline; }
    time { color: var(--muted); font: .8rem/1.6 var(--sans); font-variant-numeric: tabular-nums; }
    .post time { grid-area: 1 / 1; padding-top: .3rem; }
    .post p { grid-column: 2; max-width: 64ch; margin: 0; color: var(--muted); font-size: .96rem; }
    .reader { max-width: 46rem; }
    .reader h1 { max-width: none; margin-block: 1.1rem .65rem; font-size: clamp(2.35rem, 6vw, 4.6rem); }
    .reader time { display: block; margin-bottom: 2rem; }
    .reader h2, .reader h3 { margin-top: 2rem; }
    .reader img { max-width: 100%; height: auto; }
    .reader pre { padding: 1rem; overflow: auto; background: #ebeeea; }
    footer { border-top: 1px solid var(--rule); color: var(--muted); }
    footer .frame { display: flex; align-items: baseline; flex-wrap: wrap; gap: .3rem 1rem; padding-block: 1.4rem 2rem; font-size: .875rem; }
    footer strong { color: var(--ink); }
    @media (max-width: 38rem) {
      .frame { width: calc(100% - 2rem); }
      .post { grid-template-columns: 1fr; }
      .post h3, .post p { grid-column: 1; }
      .post time { padding-top: 0; }
    }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="frame">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
      <nav class="navigation" aria-label="Site navigation">
        <a href="{{ '/' | relative_url }}#recent-posts">Articles</a>
        <a href="https://github.com/walker5555">GitHub</a>
      </nav>
    </div>
  </header>
  <main class="frame" id="main">
    {% if page.date %}
    <article class="reader">
      <a href="{{ '/' | relative_url }}#recent-posts">← All articles</a>
      <h1>{{ page.title | escape }}</h1>
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d %b %Y" }}</time>
      {{ content }}
    </article>
    {% else %}
    {{ content }}
    {% endif %}
  </main>
  <footer>
    <div class="frame"><strong>{{ site.title | escape }}</strong><span>SOC analyst · Windows forensics and incident response</span></div>
  </footer>
</body>
</html>
