<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ page.title | default: site.title | escape }}</title><meta name="description" content="{{ page.description | default: site.description | escape }}">
<style>*{box-sizing:border-box}body{margin:0;background:#101722;color:#dbe4ef;font:16px/1.65 system-ui,sans-serif}a{color:#8ce1d0;text-underline-offset:.23em}a:hover{color:#fff}header{border-bottom:1px solid #2c394b;background:#141e2c}.bar,.shell,footer{max-width:1120px;margin:auto;padding:22px 28px}.bar{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}.brand{font-size:1.12rem;font-weight:750;color:#f0f5fb;text-decoration:none}nav{display:flex;gap:20px;flex-wrap:wrap}nav a{font-size:.9rem}.shell{display:grid;grid-template-columns:225px minmax(0,1fr);gap:54px;padding-top:56px;padding-bottom:64px;min-height:70vh}aside{border-right:1px solid #2c394b;padding-right:24px}.monogram{display:grid;place-items:center;width:72px;height:72px;border:1px solid #42655f;border-radius:18px;background:#183532;color:#8ce1d0;font-size:1.65rem;font-weight:800}h1,h2{line-height:1.18;color:#f0f5fb}aside h2{margin-bottom:8px;font-size:1.35rem}p,time{color:#aebed0}h1{margin:0 0 14px;font-size:clamp(2.3rem,7vw,4.2rem);letter-spacing:-.055em}.summary{max-width:58ch;font-size:1.12rem;margin-bottom:36px}.archive h2{font-size:1.2rem;border-bottom:1px solid #344154;padding-bottom:10px}.post{padding:18px 0;border-bottom:1px solid #2c394b}.post h3{margin:5px 0;font-size:1.35rem}.post p{margin:6px 0 0}time,.topic{font-size:.84rem}.topic{color:#8ce1d0}footer{border-top:1px solid #2c394b;color:#aebed0;font-size:.87rem}article img{max-width:100%;height:auto}pre{padding:14px;overflow:auto;background:#141e2c}a:focus-visible{outline:2px solid #8ce1d0;outline-offset:4px}@media(max-width:680px){.shell{grid-template-columns:1fr;gap:28px;padding-top:26px}aside{border-right:0;border-bottom:1px solid #2c394b;padding-bottom:20px}}</style></head>
<body><header><div class="bar"><a class="brand" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a></div></header>
<div class="shell"><aside aria-label="Author profile"><div class="monogram" aria-hidden="true">W</div><h2>Walker</h2><p>SOC practitioner writing about digital forensics, incident response, and cyber threats.</p><a href="https://github.com/walker5555">GitHub</a></aside>
<main id="main">
{% if page.date %}<article><a href="{{ '/' | relative_url }}#recent-posts">← All posts</a><h1>{{ page.title | escape }}</h1><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d %b %Y" }}</time>{{ content }}</article>{% else %}{{ content }}{% endif %}
</main></div><footer>Walker</footer></body></html>
